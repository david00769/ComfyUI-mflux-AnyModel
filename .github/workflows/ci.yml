name: tests

on:
  push:
  pull_request:

jobs:
  # The retired fork (mflux-CV, frozen at 0.18.39-CV), still the only runtime with ControlNet
  # stacking, Mage Flow and Qwen-Image-Layered.
  selftests:
    name: self-tests (mflux-CV, frozen)
    # Apple Silicon runner: mflux/MLX require arm64 macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mflux-CV fork
        # The fork's distribution is named `mflux-cv` (it still imports as `mflux`), so the
        # PEP 508 name in the direct reference has to be mflux-cv, not mflux.
        run: pip install "mflux-cv @ git+https://github.com/HowDidTheCatGetSoFat/mflux-cv.git@main"
      - name: Dispatch + capability self-tests
        run: python tests/test_dispatch.py
      - name: Sampler self-tests
        run: python tests/test_sampler.py
      - name: Segmentation (AutoMask) self-tests
        run: python tests/test_segmentation.py
      - name: Upstream-compatibility smoke test
        run: python tests/smoke_import.py

  # Registry config: stock upstream mflux from PyPI (what a ComfyUI Manager user gets).
  # This is the primary runtime since 0.9.1, so it runs every self-test, not just the import.
  selftests-upstream:
    name: self-tests (stock mflux from PyPI)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install stock mflux
        run: pip install "mflux>=0.18.0"
      - name: Dispatch + capability self-tests
        run: python tests/test_dispatch.py
      - name: Sampler self-tests
        run: python tests/test_sampler.py
      - name: Segmentation (AutoMask) self-tests
        run: python tests/test_segmentation.py
      - name: Live preview self-tests
        run: python tests/test_preview.py
      - name: mlx-serve engine self-tests (fake server, no weights)
        run: python tests/test_mlxserve.py
      - name: Node loads on stock mflux
        run: python tests/smoke_import.py
